services:
  - type: web
    name: household-replenishment-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: APP_NAME
        value: 家庭 AI 补货助手
      - key: TIMEZONE
        value: America/Los_Angeles
      - key: RETAIL_SEARCH_MODE
        value: search_urls
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DATABASE_PATH
        value: data/home_inventory.sqlite3
      - key: USE_GOOGLE_SHEETS
        value: false
      - key: ENABLE_GMAIL_ORDER_ANALYSIS
        value: false
      - key: ENABLE_EMAIL_SUMMARY
        value: false
      - key: GEMINI_API_KEY
        sync: false
